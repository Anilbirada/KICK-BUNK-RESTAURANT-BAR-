# Render Blueprint for KICK BUNK 360 Enterprise Platform
# Deploys Managed PostgreSQL DB, Centralized Backend REST API & Next.js 14 Web Portal

databases:
  - name: kickbunk-db
    databaseName: kickbunk360
    user: postgres
    plan: free
    region: oregon

services:
  # 1. Centralized Backend API (Express + Socket.IO + Prisma)
  - type: web
    name: kickbunk-backend
    env: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build && node dist/prisma/seed.js
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kickbunk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: NODE_ENV
        value: production

  # 2. Customer & Operations Web App (Next.js 14)
  - type: web
    name: kickbunk-frontend
    env: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://kickbunk-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://kickbunk-backend.onrender.com
      - key: NODE_ENV
        value: production
