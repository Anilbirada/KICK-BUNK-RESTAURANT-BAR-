# Render Blueprint for KICK BUNK Luxury Website
services:
  # 1. Customer Luxury Website (Next.js 14)
  - type: web
    name: kickbunk-luxury-website
    env: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://kickbunk-backend.onrender.com/api/v1
