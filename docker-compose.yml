version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kickbunk360-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kickbunk360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kickbunk360-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/kickbunk360?schema=public"
      JWT_SECRET: "kickbunk360_production_jwt_secret_token_2026"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:3000"
      NODE_ENV: "production"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kickbunk360-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
